[package]
name = "automotive-store"
version = "1.4.3"
edition = "2021"

[lib]
name = "automotive_store_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = "0.6"
getrandom = "0.2"
